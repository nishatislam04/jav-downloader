[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jav-downloader"
version = "3.1.4"
description = "Headless downloader for JableTV, MissAV, SupJav, Hanime1, Jav.guru, and SpankBang"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ALOS", email = "alos21750@users.noreply.github.com" }]
keywords = [
  "jabletv",
  "missav",
  "supjav",
  "hanime1",
  "video-downloader",
  "av-downloader",
  "jav-downloader",
  "javguru",
  "spankbang",
  "headless-downloader",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/nishatislam04/jav-downloader"
Releases = "https://github.com/nishatislam04/jav-downloader/releases"
Issues = "https://github.com/nishatislam04/jav-downloader/issues"

[project.scripts]
jav = "jav_downloader.cli.headless:main"
jav-downloader = "jav_downloader.cli.headless:main"
jav-downloader-cli = "jav_downloader.cli.headless:main"
jav-web = "jav_downloader.web.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
